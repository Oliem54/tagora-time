name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Supabase remote guard tests
        run: npm run db:guard:test

      - name: Assert no direct supabase db push/link scripts
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          for (const [name, value] of Object.entries(pkg.scripts || {})) {
            const script = String(value).trim();
            if (/^supabase\s+db\s+push\b/.test(script) || /^supabase\s+link\b/.test(script)) {
              console.error(`FORBIDDEN direct CLI script: ${name} -> ${script}`);
              process.exit(1);
            }
          }
          const workflow = fs.readFileSync(".github/workflows/ci.yml", "utf8");
          const runLines = workflow
            .split(/\r?\n/)
            .filter((line) => /^\s+run:\s+/.test(line) || /^\s+run:\s*$/.test(line) || /^\s{2,}npm\s+/.test(line) || /^\s{2,}supabase\s+/.test(line));
          const joined = runLines.join("\n");
          if (/\bsupabase\s+(db\s+push|link|migration)\b/.test(joined)) {
            console.error("FORBIDDEN remote Supabase CLI invocation in CI run steps");
            process.exit(1);
          }
          console.log("OK: no direct supabase db push/link in package.json or CI run steps");
          NODE

      - name: Build
        run: npm run build
        env:
          # Build Next.js sans secrets réels ; valeurs factices pour les clés publiques.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: anon-placeholder-for-ci-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
